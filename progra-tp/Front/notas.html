<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Notas | Sistema Académico</title>
    <link rel="stylesheet" href="CSS/main.css">
    <script src="JS/auth.js"></script>
    <script src="JS/notas.js" defer></script>
</head>
<body>
    <div class="layout-container">
        <!-- BARRA LATERAL (Igual que en index.html) -->
        <aside class="sidebar">
            <div class="brand">
                <h2>Panel Académico</h2>
            </div>
            <nav class="menu">
                <button class="nav-btn" onclick="window.location.href='index.html'">
                    📚 Alumnos
                </button>
                <button class="nav-btn active" onclick="window.location.href='notas.html'">
                    📝 Notas
                </button>
                <button class="nav-btn" onclick="window.location.href='estadisticas.html'">
                    📊 Estadísticas
                </button>
                <button class="nav-btn btn-logout" onclick="cerrarSesion()">
                    🚪 Cerrar Sesión
                </button>
            </nav>
        </aside>

        <!-- CONTENIDO PRINCIPAL -->
        <main class="main-content">
            <header class="top-header">
                <h1 id="tituloSeccion">Notas de los Alumnos</h1>
            </header>

            <section id="vistaNotas">
                <table class="table-custom">
                    <thead>
                        <tr>
                            <th>Legajo</th>
                            <th>Nombre</th>
                            <th>Apellido</th>
                            <th>Carrera</th>
                            <th>Materia</th>
                            <th>Nota</th>
                            <th>Tipo</th>
                        </tr>
                    </thead>
                    <tbody id="tablaNotas">
                        <!-- Se llena mediante JavaScript -->
                    </tbody>
                </table>
            </section>
        </main>
    </div>
</body>
</html>
