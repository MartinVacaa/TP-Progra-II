<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Notas | Sistema Académico</title>
    <link rel="stylesheet" href="CSS/main.css">
    <link rel="stylesheet" href="CSS/notas.css">
    <script src="JS/notas.js" defer></script>
</head>
<body>
    <div class="layout-container">
        <aside class="sidebar">
            <div class="brand">
                <h2>Panel Académico</h2>
            </div>
            <nav class="menu">
                <button class="nav-btn" onclick="window.location.href='index.html'">
                    📚 Alumnos
                </button>
                <button class="nav-btn active" onclick="window.location.href='notas.html'">
                    📝 Notas
                </button>
                <button class="nav-btn" onclick="window.location.href='estadisticas.html'">
                    📊 Estadísticas
                </button>
                <button class="nav-btn btn-logout" onclick="cerrarSesion()">
                    🚪 Cerrar Sesión
                </button>
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <h1 id="tituloSeccion">Notas de los Alumnos</h1>
            </header>

            <section id="vistaNotas">
                <div class="barra-notas">
                    <input type="search" id="buscador" class="campo-notas" placeholder="Buscar por legajo, alumno o materia">
                    <button id="btnNuevaNota" class="btn-notas">Nueva nota</button>
                </div>

                <table class="table-custom">
                    <thead>
                        <tr>
                            <th>Legajo</th>
                            <th>Alumno</th>
                            <th>Notas cargadas</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="tablaNotas"></tbody>
                </table>
            </section>
        </main>
    </div>

    <!-- MODAL: NUEVA / EDITAR NOTA -->
    <div id="modalNota" class="modal-notas">
        <div class="modal-notas-caja">
            <h3 id="tituloModal">Nueva nota</h3>

            <label>Alumno</label>
            <select id="selAlumno" class="campo-notas"></select>

            <label>Materia</label>
            <select id="selMateria" class="campo-notas"></select>

            <label>Tipo</label>
            <select id="selTipo" class="campo-notas">
                <option value="PARCIAL 1">Parcial 1</option>
                <option value="PARCIAL 2">Parcial 2</option>
                <option value="RECUPERATORIO">Recuperatorio</option>
                <option value="FINAL">Final</option>
            </select>

            <label>Nota (1 a 10)</label>
            <input type="number" id="inputValor" class="campo-notas" min="1" max="10" step="0.5">

            <label>Fecha</label>
            <input type="date" id="inputFecha" class="campo-notas">

            <div class="botones-modal">
                <button id="btnCancelar" class="btn-notas gris">Cancelar</button>
                <button id="btnGuardar" class="btn-notas">Guardar</button>
            </div>
        </div>
    </div>

    <!-- MODAL: CONFIRMAR ELIMINAR -->
    <div id="modalEliminar" class="modal-notas">
        <div class="modal-notas-caja">
            <h3>Eliminar nota</h3>
            <p id="textoEliminar"></p>
            <div class="botones-modal">
                <button id="btnCancelarEliminar" class="btn-notas gris">No, volver</button>
                <button id="btnConfirmarEliminar" class="btn-notas eliminar">Sí, eliminar</button>
            </div>
        </div>
    </div>

    <div id="mensaje" class="mensaje"></div>

    <script src="JS/auth.js"></script>
</body>
</html>
