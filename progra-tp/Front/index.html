<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistema Académico</title>
    <link rel="stylesheet" href="CSS/main.css">
    <script src="JS/alumno.js" defer></script>
</head>
<body>
    <div class="layout-container">
        <!-- BARRA LATERAL (Fija en todo momento) -->
        <aside class="sidebar">
            <div class="brand">
                <h2>Panel Académico</h2>
            </div>
            <nav class="menu">
                <button class="nav-btn active" onclick="navegarA('alumnos')">
                    📚 Alumnos
                </button>
                <button class="nav-btn" onclick="window.location.href='notas.html'">
                    📝 Notas
                </button>
                <button class="nav-btn active" onclick="window.location.href='estadisticas.html'">
                    📊 Estadísticas
                </button>
                <button class="nav-btn btn-logout" onclick="cerrarSesion()">
                    🚪 Cerrar Sesión
                </button>
            </nav>
        </aside>

        <!-- CONTENIDO PRINCIPAL (Varía según el botón tocado) -->
        <main class="main-content">
            <header class="top-header">
                <h1 id="tituloSeccion">Listado de Alumnos</h1>
            </header>
            
            <!-- Aquí se inyecta la tabla o datos de la sección elegida -->
            <section id="vistaDinamica">
                <table class="table-custom">
                    <thead>
            <tr>
                <th>Legajo</th>
                <th>Nombre</th>                        
                <th>Apellido</th>
                <th>Dni</th>
                <th>Email</th>
                
            </tr>
        </thead>
        <tbody id="lista-alumnos">

        </tbody>

                </table>
            
                <!-- Se llena mediante JavaScript -->
            </section>
        </main>
    </div>
    <div id="modalAlumno" class="modal-overlay">
        <div class="modal-card">
            <h2 id="tituloModalAlumno">Nuevo Alumno</h2>
            <form id="formAlumno">
                <input type="hidden" id="alumnoLegajo">
                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" required>
                </div>
                <div class="form-group">
                    <label for="apellido">Apellido</label>
                    <input type="text" id="apellido" required>
                </div>
                <div class="form-group">
                    <label for="dni">DNI</label>
                    <input type="text" id="dni" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label for="nombreUsuario">Nombre de Usuario</label>
                    <input type="text" id="nombreUsuario" required>
                </div>
                <div class="form-group">
                    <label for="contrasena">Contraseña</label>
                    <input type="password" id="contrasena" required>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-secondary" onclick="cerrarModalAlumno()">Cancelar</button>
                    <button type="submit" class="btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>
   

    
    
</body>
</html>
