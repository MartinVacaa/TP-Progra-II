<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primer ingreso | Sistema Académico</title>
    <style>
        * { box-sizing: border-box; }
        body { background: #f4f6fb; margin: 0; font: 16px system-ui, sans-serif; min-height: 100vh; display: grid; place-items: center; color: #192439; }
        main { background: white; width: min(92vw, 420px); padding: 28px; border-radius: 14px; box-shadow: 0 12px 36px #18233a20; }
        h1 { font-size: 1.35rem; margin: 0 0 9px; }
        p { line-height: 1.45; color: #4f5a6d; }
        label { display: block; margin-top: 17px; margin-bottom: 6px; font-weight: 600; }
        input { width: 100%; padding: 12px; border: 1px solid #b9c2d4; border-radius: 8px; font: inherit; }
        button { width: 100%; background: #284baf; color: white; border: none; border-radius: 8px; padding: 13px; margin-top: 22px; font: inherit; cursor: pointer; }
        button:disabled { opacity: .65; cursor: wait; }
        #mensaje { min-height: 24px; margin-top: 14px; }
        a { color: #284baf; }
    </style>
</head>
<body>
    <main>
        <h1>Creá tu contraseña</h1>
        <p>Tu cuenta tiene una contraseña temporal. Para ingresar al portal, primero tenés que cambiarla.</p>
        <form id="form-cambio">
            <label for="usuario">Usuario</label>
            <input id="usuario" autocomplete="username" required>
            <label for="temporal">Contraseña temporal</label>
            <input id="temporal" type="password" autocomplete="current-password" required>
            <label for="nueva">Contraseña nueva (mínimo 12 caracteres)</label>
            <input id="nueva" type="password" autocomplete="new-password" minlength="12" required>
            <label for="confirmar">Repetí la contraseña nueva</label>
            <input id="confirmar" type="password" autocomplete="new-password" minlength="12" required>
            <button type="submit" id="guardar">Guardar contraseña</button>
        </form>
        <p id="mensaje" role="status" aria-live="polite"></p>
        <a href="login.html">Volver al inicio de sesión</a>
    </main>
    <script>
        const formulario = document.getElementById("form-cambio");
        const mensaje = document.getElementById("mensaje");
        const guardar = document.getElementById("guardar");
        document.getElementById("usuario").value = sessionStorage.getItem("usuarioCambioPassword") || "";

        formulario.addEventListener("submit", async e => {
            e.preventDefault();
            const usuario = document.getElementById("usuario").value.trim();
            const passwordTemporal = document.getElementById("temporal").value;
            const passwordNueva = document.getElementById("nueva").value;
            const confirmar = document.getElementById("confirmar").value;
            mensaje.textContent = "";
            if (passwordNueva !== confirmar) {
                mensaje.textContent = "Las contraseñas nuevas no coinciden.";
                return;
            }
            if (passwordNueva.length < 12) {
                mensaje.textContent = "La contraseña nueva necesita al menos 12 caracteres.";
                return;
            }
            guardar.disabled = true;
            try {
                const respuesta = await fetch("http://localhost:5000/api/PrimerIngreso/cambiar-password", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ usuario, passwordTemporal, passwordNueva })
                });
                if (!respuesta.ok) {
                    const error = await respuesta.text();
                    throw new Error(error || `Error ${respuesta.status}`);
                }
                sessionStorage.removeItem("usuarioCambioPassword");
                mensaje.textContent = "Contraseña actualizada. Volvé a iniciar sesión con tu contraseña nueva.";
                formulario.reset();
                setTimeout(() => { window.location.href = "login.html"; }, 1600);
            } catch (err) {
                mensaje.textContent = "No se pudo cambiar la contraseña. Revisá la contraseña temporal y que la API esté ejecutándose.";
                console.error(err);
            } finally {
                guardar.disabled = false;
            }
        });
    </script>
</body>
</html>
