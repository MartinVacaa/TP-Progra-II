<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Sistema Académico</title>
    <link rel="stylesheet" href="CSS/login.css">
</head>
<body>
    <main class="login-card">
        <header class="login-header">
            <h1>Sistema Académico</h1>
            <p>Ingresá con tu usuario y contraseña</p>
        </header>

        <form id="form-login" class="login-form" autocomplete="on">
            <div class="campo">
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" name="usuario" placeholder="Tu usuario" autocomplete="username" required>
            </div>

            <div class="campo">
                <label for="contrasena">Contraseña</label>
                <input type="password" id="contrasena" name="contrasena" placeholder="Tu contraseña" autocomplete="current-password" required>
            </div>

            <button type="submit" class="btn-ingresar">Ingresar</button>
        </form>
    </main>
</body>
</html>
